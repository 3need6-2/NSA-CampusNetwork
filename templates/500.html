<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 · 服务器内部错误</title>
    <style>
        :root {
            --bg: #020617;
            --panel: rgba(15, 23, 42, 0.82);
            --border: rgba(148, 163, 184, 0.18);
            --text: #f8fafc;
            --muted: #94a3b8;
            --red: #ef4444;
            --cyan: #38bdf8;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            background: radial-gradient(circle at 30% 50%, rgba(239, 68, 68, 0.08), transparent 50%),
                        linear-gradient(180deg, #020617 0%, #050816 42%, #08111f 100%);
        }
        .card {
            text-align: center;
            padding: 48px 56px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--panel);
            backdrop-filter: blur(16px);
            max-width: 480px;
        }
        .code {
            font-size: 96px;
            font-weight: 700;
            color: var(--red);
            line-height: 1;
            margin-bottom: 8px;
        }
        h1 { margin: 0 0 12px; font-size: 22px; }
        p { color: var(--muted); margin: 0 0 28px; font-size: 14px; line-height: 1.6; }
        a {
            display: inline-block;
            padding: 10px 28px;
            border: 1px solid var(--cyan);
            border-radius: 6px;
            color: var(--cyan);
            text-decoration: none;
            font-size: 14px;
            transition: background 0.2s;
        }
        a:hover { background: rgba(56, 189, 248, 0.12); }
    </style>
</head>
<body>
    <div class="card">
        <div class="code">500</div>
        <h1>服务器内部错误</h1>
        <p>服务器遇到了意外错误。<br>请稍后重试或联系管理员。</p>
        <a href="/">返回首页</a>
    </div>
</body>
</html>
